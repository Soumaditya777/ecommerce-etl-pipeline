[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-pyspark-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyspark==4.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ecommerce-pipeline = "ecommerce_pipeline.pipeline:run_pipeline"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
